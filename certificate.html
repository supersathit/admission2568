<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลการสอบ pre m.1 โรงเรียนวัชรวิทยา</title>
    <script src="https://kit.fontawesome.com/994507c3ac.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script>
        function showUser() {
            let ptn = document.getElementById("user_id").value;

            if (ptn == "") {
                alert("กรุณากรอกเลขบัตรประชาชน 13 หลัก");
                // document.getElementById("txtHint").innerHTML = "ไม่พบข้อมูล";
                // return;
            } else {
                var xmlhttp = new XMLHttpRequest();
                xmlhttp.onreadystatechange = function () {
                    if (this.readyState == 4 && this.status == 200) {
                        document.getElementById("txtPrint").innerHTML = this.responseText;
                    }
                };
                xmlhttp.open("GET", "getprint.php?p=" + ptn, true);
                xmlhttp.send();
            }
        }
    </script>
</head>

<body style="background-color: aliceblue;">
    <div class="header shadow-sm mb-5">
        <img src="img/logo โรงเรยีน.png" height="40px">
        <div class="text-header" onclick="window.location.assign('index.html')">ระบบสมัครสอบ pre M.1 โรงเรียนวัชรวิทยา
            ปีการศึกษา 2567</div>
    </div>
    <div class="container">
        <h4 class="text-center text-secondary mb-5">😆 ผลการสอบแข่งขันโครงการ Pre M.1 โรงเรียนวัชรวิทยา</h4>
        <div class="card p-5 mb-5">
            <h5 class="mb-5 text-center fw-bold">กรอกเลขบัตรประชาชนแล้วกดค้นหาเพื่อดูคะแนน</h5>
            <div class="row">
                <div class="col-lg-4 col-sm-12 mb-2 text-lg-end text-sm-start">กรอกเลขบัตรประชาชน : </div>
                <div class="col-lg-8 col-sm-12 mb-2">
                    <input type="text" id="user_id" name="user_id" class="form-control" maxlength="13">
                    <span id="tt" class="text-danger"></span>
                </div> 
            </div>
            <div class="d-flex justify-content-center p-3">
                <button type="submit" onclick="showUser()" class="btn btn-success" style="width: 100px;">
                    <i class="fa-solid fa-magnifying-glass"></i> ค้นหา
                </button>
            </div>
        </div>

        <div id="txtPrint" class="text-center"></div>


    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous">
    </script>
</body>

</html>
